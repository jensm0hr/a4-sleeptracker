<ion-header>
  <ion-toolbar>
    <ion-title>History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (item of allSleepData; track item.id) {
      <ion-item-sliding #sliding>
        <ion-item>
          <ion-icon slot="start" [name]="iconFor(item)" [color]="colorFor(item)"></ion-icon>
          <ion-label>
            <h2>{{ item.dateString() }}</h2>
            <p>{{ item.summaryString() }}</p>
          </ion-label>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="confirmDelete(item, sliding)">
            <ion-icon slot="icon-only" name="trash" [color]="colorFor(item)"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>
</ion-content>
